name: MP MD Issues

on:
  push:
    branches:
      - main
    paths:
      - 'mp-readme.md'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  mp-md-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 markdownify lxml

      - name: Detect new lines
        id: detect
        run: |
          python scripts/detect_new_lines.py
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Fetch articles
        if: steps.detect.outputs.has_new == 'true'
        run: |
          python scripts/fetch_articles.py
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Create issues
        if: steps.detect.outputs.has_new == 'true'
        run: |
          python scripts/create_issues.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit changes
        if: steps.detect.outputs.has_new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mp_md .github/state
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add new mp articles [skip ci]"
            git push
          fi