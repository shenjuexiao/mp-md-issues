# .github/workflows/mp-md-issues.yml
name: MP Markdown to Issues

on:
  push:
    paths:
      - 'mp-readme.md'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 markdownify lxml

      - name: Detect changes in mp-readme.md
        id: diff
        run: |
          git fetch origin ${{ github.event.before }} --depth=1 || true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发时，全部按新增处理
            python scripts/detect_changes.py --mode full
          else
            python scripts/detect_changes.py \
              --before ${{ github.event.before }} \
              --after ${{ github.sha }}
          fi

      - name: Extract articles to markdown
        run: |
          python scripts/mp_extract.py \
            --readme mp-readme.md \
            --output mp_md \
            --changes changes.json

      # ---------- 本仓库 Issues 操作 ----------
      - name: Create new Issues (this repo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/mp_issue_create.py \
            --repo ${{ github.repository }} \
            --readme mp-readme.md \
            --md-dir mp_md \
            --changes changes.json \
            --token ${{ secrets.GITHUB_TOKEN }}

      - name: Update modified Issues (this repo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/mp_issue_update.py \
            --repo ${{ github.repository }} \
            --readme mp-readme.md \
            --md-dir mp_md \
            --changes changes.json \
            --token ${{ secrets.GITHUB_TOKEN }}

      - name: Delete removed Issues (this repo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/mp_issue_delete.py \
            --repo ${{ github.repository }} \
            --changes changes.json \
            --token ${{ secrets.GITHUB_TOKEN }}

      # ---------- 同步到目标仓库 shenjuexiao/mp-md-out ----------
      - name: Create new Issues (target repo)
        env:
          GH_TOKEN: ${{ secrets.MP_MD }}
        run: |
          python scripts/mp_issue_create.py \
            --repo shenjuexiao/mp-md-out \
            --readme mp-readme.md \
            --md-dir mp_md \
            --changes changes.json \
            --token ${{ secrets.MP_MD }}

      - name: Update modified Issues (target repo)
        env:
          GH_TOKEN: ${{ secrets.MP_MD }}
        run: |
          python scripts/mp_issue_update.py \
            --repo shenjuexiao/mp-md-out \
            --readme mp-readme.md \
            --md-dir mp_md \
            --changes changes.json \
            --token ${{ secrets.MP_MD }}

      - name: Delete removed Issues (target repo)
        env:
          GH_TOKEN: ${{ secrets.MP_MD }}
        run: |
          python scripts/mp_issue_delete.py \
            --repo shenjuexiao/mp-md-out \
            --changes changes.json \
            --token ${{ secrets.MP_MD }}

      # ---------- 提交生成的 markdown ----------
      - name: Commit generated markdown
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mp_md/ mp-readme.md
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore: update mp_md from mp-readme.md [skip ci]"
          git push
